[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Agentic financial research pipeline: extract, transform, index and report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
]
extract = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "yfinance>=0.2.40",
    "feedparser>=6.0",
]
transform = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tiktoken>=0.7",
]
agent = [
    "openai>=1.40",
    "pydantic>=2.8",
]
orchestration = [
    # Airflow does not support the newest Python releases yet.
    "apache-airflow>=2.10; python_version < '3.14'",
]
all = [
    "financial-research-agent[extract,transform,agent,orchestration]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "issue_0: Day 0 scaffolding",
    "issue_1: Raw document Pydantic schemas",
    "issue_2: SEC EDGAR filings extractor",
    "issue_3: Market data extractor (yfinance)",
    "issue_4: News RSS extractor",
    "issue_5: Raw storage writer and extractor fixtures tests",
    "issue_6: Filing parser and text cleaner",
    "issue_7: Document chunker",
    "issue_8: Embedding generator",
    "issue_9: Vector store loader",
    "issue_10: Financial metrics normalizer",
    "issue_11: Retrieval tool",
    "issue_12: Market data tool",
    "issue_13: LLM client abstraction",
    "issue_14: Agent loop with tool calling",
    "issue_15: Structured report generator with citations",
    "issue_16: Agent evaluation harness",
    "issue_17: Ingestion DAG",
    "issue_18: Transform and indexing DAG",
    "issue_19: CLI and FastAPI endpoint",
    "issue_20: Dockerfile and docker-compose",
    "issue_21: GitHub Actions CI workflow",
    "issue_22: Final documentation and demo",
]
